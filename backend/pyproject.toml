[project]
name = "chatbot-itt-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"

dependencies = [
  "fastapi==0.122.0",
  "uvicorn[standard]==0.38.0",
  "python-dotenv==1.2.1",
  "langchain==0.2.16",
  "langchain-core==0.2.43",
  "langchain-community==0.2.16",
  "langchain-text-splitters==0.2.4",
  "langchain-google-genai==1.0.7",
  "google-generativeai==0.7.2",
  "google-api-python-client==2.187.0",
  "faiss-cpu==1.13.0",
  "pymupdf==1.26.6",
  "langgraph==0.2.53",
  "pydantic-settings==2.12.0",
  "httpx==0.28.1",
  "slowapi==0.1.9",
  "openpyxl==3.1.5",
  "google-auth>=2.43.0",
  "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
