[project]
name = "chatbot-itt-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-dotenv",
  "langchain",
  "langchain-core",
  "langchain-community",
  "langchain-text-splitters",
  "langchain-google-genai",
  "google-generativeai",
  "faiss-cpu",
  "pymupdf",
  "langgraph",
  "slowapi>=0.1.10",
  "google-auth>=2.43.0",
  "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
